name: format-astra-director

on:
  push:
    branches:
      - chatgpt/astra-game-director
    paths:
      - scripts/astra-game-director.mjs
      - .github/workflows/format-astra-director.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/astra-game-director
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/astra-game-director.mjs
      - name: Commit formatted director
        run: |
          if git diff --quiet -- scripts/astra-game-director.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/astra-game-director.mjs
          git commit -m "Format Astra game director"
          git push origin HEAD:chatgpt/astra-game-director
