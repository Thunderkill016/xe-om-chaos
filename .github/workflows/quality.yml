name: quality

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Integrate playable HCMC OSM corridor
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          node scripts/apply-playable-hcm-corridor.mjs
          npx prettier --write src/game/Run.js src/game/Missions.js src/main.js scripts/core-driving-smoke.mjs src/world/HcmCorridor.js src/view/HcmCorridorView.js tests/hcm-corridor.test.js
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/game/Run.js src/game/Missions.js src/main.js scripts/core-driving-smoke.mjs src/world/HcmCorridor.js src/view/HcmCorridorView.js tests/hcm-corridor.test.js
            git commit -m "Integrate playable HCMC OSM corridor"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
      - name: Verify committed HCMC context exists
        run: |
          test -s src/world/hcm-downtown-data.js
          grep -q "OpenStreetMap contributors" src/world/hcm-downtown-data.js
          grep -q "HCMC_OSM_DATA" src/world/hcm-downtown-data.js
      - name: Opening route diagnostic
        run: |
          node --input-type=module -e 'import { driveOpeningRoute } from "./scripts/evaluate-routes.mjs"; const { run, measurement } = driveOpeningRoute("2026-09-06", "hem26"); console.log(JSON.stringify({ measurement, crashes: run.moments.filter((m) => m.type === "crash") }, null, 2));'
      - run: npm run quality
      - name: Package both language editions
        run: npm run package

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          npm start > /tmp/xeom-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/xeom-server.log
          exit 1
      - name: Real browser core-driving smoke
        env:
          XEOM_OUTPUT: output/core-driving
        run: node scripts/core-driving-smoke.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-driving-browser-smoke
          path: output/core-driving
          if-no-files-found: error
