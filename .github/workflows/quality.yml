name: quality

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Canonicalize PlayCanvas migration
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          npm install --package-lock-only --ignore-scripts
          python - <<'PY'
          from pathlib import Path
          path = Path("src/view/PlayCanvasScene.js")
          text = path.read_text()
          old = "    const markerMaterial = this.marker.render?.material;"
          new = '''    const markerMaterial = /** @type {pc.StandardMaterial | null} */ (
            this.marker.render?.material ?? null
          );'''
          if old in text:
              path.write_text(text.replace(old, new))
          PY
          if grep -q "function interpolateSourceRoute" src/world/HcmCorridor.js; then
            node scripts/patch-real-saigon-road.mjs
          fi
          if grep -q "const startSnap = nearestRoadNode(graph, startAnchor)" src/world/HcmCorridor.js; then
            node scripts/patch-connected-saigon-snaps.mjs
          fi
          node scripts/patch-saigon-anchor-and-traffic.mjs
          npx prettier --write package.json package-lock.json src/world/HcmCorridor.js src/view/PlayCanvasScene.js src/main.js scripts/playcanvas-smoke.mjs scripts/package.mjs index.html src/view/HcmCorridorView.js src/view/OsmContext.js
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json src/world/HcmCorridor.js src/view/PlayCanvasScene.js src/main.js scripts/playcanvas-smoke.mjs scripts/package.mjs index.html src/view/HcmCorridorView.js src/view/OsmContext.js
            git commit -m "Correct Saigon anchors and corridor traffic"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
      - run: npm ci
      - name: Verify committed HCMC context exists
        run: |
          test -s src/world/hcm-downtown-data.js
          grep -q "OpenStreetMap contributors" src/world/hcm-downtown-data.js
          grep -q "HCMC_OSM_DATA" src/world/hcm-downtown-data.js
      - name: Opening route diagnostic
        run: |
          node --input-type=module -e 'import { driveOpeningRoute } from "./scripts/evaluate-routes.mjs"; const { run, measurement } = driveOpeningRoute("2026-09-06", "hem26"); console.log(JSON.stringify({ measurement, crashes: run.moments.filter((m) => m.type === "crash") }, null, 2));'
      - name: Real Saigon corridor diagnostic
        run: |
          node --input-type=module - <<'NODE'
          import { CONFIG, random } from './src/game/config.js';
          import { REAL_HCM_CORRIDOR, REAL_HCM_CORRIDOR_BUILDINGS, makeWorldTraffic, realCorridorDistance, worldTrafficPose } from './src/world/HcmCorridor.js';
          const traffic = makeWorldTraffic(random('diag'), CONFIG.trafficCount, CONFIG.rushCount).filter(v => v.route === REAL_HCM_CORRIDOR.id);
          for (const v of traffic) worldTrafficPose(v, 0);
          console.log(JSON.stringify({
            corridor: REAL_HCM_CORRIDOR,
            end: REAL_HCM_CORRIDOR.points.at(-1),
            buildings: REAL_HCM_CORRIDOR_BUILDINGS.length,
            firstBuildings: REAL_HCM_CORRIDOR_BUILDINGS.slice(0, 4),
            traffic: traffic.map(v => ({ id:v.id, lane:v.lane, dir:v.corridorDirection, x:v.x, z:v.z, distance:realCorridorDistance(v.x,v.z) }))
          }, null, 2));
          NODE
      - run: npm run quality
      - name: Package both language editions
        run: npm run package

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          npm start > /tmp/xeom-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/xeom-server.log
          exit 1
      - name: Real browser core-driving smoke
        env:
          XEOM_OUTPUT: output/core-driving
        run: node scripts/core-driving-smoke.mjs
      - name: PlayCanvas renderer smoke
        env:
          XEOM_OUTPUT: output/playcanvas
        run: node scripts/playcanvas-smoke.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: |
            output/core-driving
            output/playcanvas
          if-no-files-found: error
